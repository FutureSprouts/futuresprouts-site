<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FutureSprouts Illustration Contact Sheet</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Georgia, "Times New Roman", serif; background: #efe9dc; color: #29321F; padding: 32px 24px 64px; }
h1 { font-size: 1.6rem; margin-bottom: 4px; }
p.note { font-size: .9rem; margin-bottom: 28px; color: #7A5233; }
section { margin-bottom: 44px; }
h2 { font-size: 1.15rem; margin-bottom: 12px; border-bottom: 2px solid #7A5233; display: inline-block; padding-bottom: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
figure { border: 1px solid #29321F; border-radius: 6px; overflow: hidden; }
figure .swatch { display: flex; align-items: center; justify-content: center; padding: 24px; }
.light .swatch { background: #FFFDF6; }
.dark .swatch { background: #29321F; }
figcaption { font-size: .78rem; padding: 6px 10px; background: #e2dac8; border-top: 1px solid #29321F; }
img.s96 { width: 96px; height: 96px; }
img.s400 { width: 400px; height: 400px; }
</style>
</head>
<body>
<h1>FutureSprouts Illustration Contact Sheet</h1>
<p class="note">Each motif shown at 96px and 400px on light (#FFFDF6) and dark (#29321F) backgrounds.</p>

<section>
<h2>Education (illustrations/education.svg)</h2>
<div class="row">
<figure class="light"><div class="swatch"><img class="s96" src="illustrations/education.svg" alt="Education motif, 96px, light"></div><figcaption>96px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s96" src="illustrations/education.svg" alt="Education motif, 96px, dark"></div><figcaption>96px on dark</figcaption></figure>
<figure class="light"><div class="swatch"><img class="s400" src="illustrations/education.svg" alt="Education motif, 400px, light"></div><figcaption>400px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s400" src="illustrations/education.svg" alt="Education motif, 400px, dark"></div><figcaption>400px on dark</figcaption></figure>
</div>
</section>

<section>
<h2>Access (illustrations/access.svg)</h2>
<div class="row">
<figure class="light"><div class="swatch"><img class="s96" src="illustrations/access.svg" alt="Access motif, 96px, light"></div><figcaption>96px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s96" src="illustrations/access.svg" alt="Access motif, 96px, dark"></div><figcaption>96px on dark</figcaption></figure>
<figure class="light"><div class="swatch"><img class="s400" src="illustrations/access.svg" alt="Access motif, 400px, light"></div><figcaption>400px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s400" src="illustrations/access.svg" alt="Access motif, 400px, dark"></div><figcaption>400px on dark</figcaption></figure>
</div>
</section>

<section>
<h2>Stewardship (illustrations/stewardship.svg)</h2>
<div class="row">
<figure class="light"><div class="swatch"><img class="s96" src="illustrations/stewardship.svg" alt="Stewardship motif, 96px, light"></div><figcaption>96px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s96" src="illustrations/stewardship.svg" alt="Stewardship motif, 96px, dark"></div><figcaption>96px on dark</figcaption></figure>
<figure class="light"><div class="swatch"><img class="s400" src="illustrations/stewardship.svg" alt="Stewardship motif, 400px, light"></div><figcaption>400px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s400" src="illustrations/stewardship.svg" alt="Stewardship motif, 400px, dark"></div><figcaption>400px on dark</figcaption></figure>
</div>
</section>

<section>
<h2>Seedling hero (illustrations/seedling.svg)</h2>
<div class="row">
<figure class="light"><div class="swatch"><img class="s96" src="illustrations/seedling.svg" alt="Seedling motif, 96px, light"></div><figcaption>96px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s96" src="illustrations/seedling.svg" alt="Seedling motif, 96px, dark"></div><figcaption>96px on dark</figcaption></figure>
<figure class="light"><div class="swatch"><img class="s400" src="illustrations/seedling.svg" alt="Seedling motif, 400px, light"></div><figcaption>400px on light</figcaption></figure>
<figure class="dark"><div class="swatch"><img class="s400" src="illustrations/seedling.svg" alt="Seedling motif, 400px, dark"></div><figcaption>400px on dark</figcaption></figure>
</div>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planting Calendar demo (FutureSprouts)</title>
  <link rel="stylesheet" href="planting-calendar.css">
  <style>
    /* Demo-only shell. Mirrors the site palette custom properties so the
       module picks them up; system font fallbacks, no external resources. */
    :root {
      --bg: #F8F3E7;
      --bg2: #EFE6CF;
      --card: #FFFDF6;
      --text: #29321F;
      --muted: #5D6450;
      --green: #3E7C4B;
      --greenDark: #275634;
      --soil: #7A5233;
      --harvest: #C3752B;
      --sun: #E7B75F;
    }
    :root[data-theme="dark"] {
      --bg: #14170F;
      --bg2: #1A1E13;
      --card: #191D12;
      --text: #F1EDDD;
      --muted: rgba(241, 237, 221, 0.72);
      --green: #6FAF7C;
      --greenDark: #55925F;
      --soil: #B08558;
      --harvest: #D89A55;
      --sun: #E7C77F;
    }
    body {
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .demo-shell { max-width: 1100px; margin: 0 auto; }
    .demo-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.75rem;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .demo-head h1 {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-size: 1.5rem;
      margin: 0;
    }
    .demo-theme-btn {
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      min-width: 44px;
      padding: 0.4rem 0.9rem;
      border-radius: 10px;
      border: 1.5px solid var(--greenDark);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .demo-theme-btn:focus-visible {
      outline: 3px solid var(--greenDark);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="demo-head">
      <h1>Planting Calendar demo</h1>
      <button type="button" class="demo-theme-btn" id="demo-theme-toggle" aria-pressed="false">Dark theme</button>
    </div>
    <div id="planting-calendar"></div>
  </div>

  <!-- Required order: grow-data.js first, then planting-calendar.js -->
  <script src="grow-data.js"></script>
  <script src="planting-calendar.js"></script>
  <script>
    window.initPlantingCalendar("planting-calendar");

    (function () {
      var btn = document.getElementById("demo-theme-toggle");
      btn.addEventListener("click", function () {
        var rootEl = document.documentElement;
        var dark = rootEl.getAttribute("data-theme") === "dark";
        if (dark) {
          rootEl.removeAttribute("data-theme");
        } else {
          rootEl.setAttribute("data-theme", "dark");
        }
        btn.setAttribute("aria-pressed", dark ? "false" : "true");
        btn.textContent = dark ? "Dark theme" : "Light theme";
      });
    })();
  </script>
</body>
</html>
